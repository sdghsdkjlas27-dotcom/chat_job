name: chat

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Задание для агента"
        required: true
      model:
        description: "Модель provider/model"
        required: false
        default: "mistral/mistral-code-latest"
      target:
        description: "Целевой репозиторий owner/name (пусто = ответ без правок кода)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  chat:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install agent CLI
        run: npm install -g opencode-ai@latest

      - name: Clone target
        if: inputs.target != ''
        run: |
          git clone --depth 1 "https://github.com/${{ inputs.target }}.git" proj 2>&1 | tail -2
          echo "файлов в proj: $(find proj -type f -not -path '*/.git/*' | wc -l)"

      - name: Run agent
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          TASK: ${{ inputs.task }}
          MODEL: ${{ inputs.model }}
        run: |
          PROMPT="$TASK"
          if [ -d proj ]; then
            PROMPT="$PROMPT

Проект склонирован в $GITHUB_WORKSPACE/proj — работай только внутри него, не пушь, просто внеси изменения и перечисли их."
          fi
          opencode run --model "$MODEL" "$PROMPT" 2>&1 | tee agent.log || true
          # free tier: исчерпана минутная квота - ждём и продолжаем ту же сессию
          for i in 1 2 3; do
            if ! tail -30 agent.log | grep -qiE "rate.?limit|429|exceeded"; then break; fi
            echo "лимит запросов - пауза 75с и продолжение сессии (попытка $i)"
            sleep 75
            opencode run --model "$MODEL" --continue "Продолжай с места остановки." 2>&1 | tee -a agent.log || true
          done
          echo "=== хвост ответа агента ==="
          tail -40 agent.log

      - name: Deliver to chat_history
        if: always()
        env:
          DELIVER_TOKEN: ${{ secrets.DELIVER_TOKEN }}
        run: |
          python3 - <<'PY'
          import os, subprocess, tempfile, datetime, shutil

          tail = ""
          if os.path.isfile("agent.log"):
              tail = open("agent.log", encoding="utf-8", errors="replace").read()[-8000:]

          stamp = datetime.datetime.now(datetime.timezone.utc)
          day = stamp.strftime("%Y-%m-%d")
          ts = stamp.strftime("%H:%M UTC")
          task = os.environ.get("TASK", "")[:2000]

          wdir = tempfile.mkdtemp()
          url = f"https://agent:{os.environ['DELIVER_TOKEN']}@github.com/sdghsdkjlas27-dotcom/chat_history.git"
          subprocess.run(["git", "clone", "--depth", "1", url, wdir], check=True, capture_output=True)

          chats = os.path.join(wdir, "chats")
          os.makedirs(chats, exist_ok=True)
          fpath = os.path.join(chats, f"{day}.md")
          header = ""
          if not os.path.isfile(fpath):
              header = f"# Chat log {day}\n"
          entry = (
              f"\n## {ts} — CI worker ({os.environ.get('GITHUB_RUN_ID', 'ci')})\n\n"
              f"**Задание:**\n\n```\n{task}\n```\n\n"
              f"**Ответ агента (хвост лога):**\n\n```\n{tail}\n```\n"
          )
          with open(fpath, "a", encoding="utf-8") as f:
              f.write(header + entry)

          def git(*a):
              subprocess.run(["git", "-C", wdir, *a], check=True, capture_output=True)
          git("add", "-A")
          git("-c", "user.name=chat-worker", "-c", "user.email=chat-worker@workers.local",
              "commit", "-m", f"chat {day} {ts}")
          subprocess.run(["git", "-C", wdir, "push"], check=True, capture_output=True)
          print("история дописана в chat_history:", day, ts)
          PY
